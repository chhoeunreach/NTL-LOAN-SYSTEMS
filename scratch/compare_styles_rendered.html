            <style>
                /* ============================================================
   LOAN MANAGEMENT - MODERN REDESIGN v2.0
   Performance-optimized, GPU-accelerated, glass-morphism UI
   ============================================================ */

/* --- DESIGN TOKENS --- */
:root {
    --lm-primary: #6366f1;
    --lm-primary-dark: #4f46e5;
    --lm-primary-light: #818cf8;
    --lm-primary-50: #eef2ff;
    --lm-primary-100: #e0e7ff;
    --lm-primary-200: #c7d2fe;
    --lm-bg: #f1f5f9;
    --lm-bg-subtle: #f8fafc;
    --lm-sidebar-width: 280px;
    --lm-sidebar-rail-width: 68px;
    --lm-sidebar: #ffffff;
    --lm-sidebar-text: #0f172a;
    --lm-sidebar-muted: #94a3b8;
    --lm-sidebar-active: #6366f1;
    --lm-text: #0f172a;
    --lm-text-secondary: #475569;
    --lm-muted: #94a3b8;
    --lm-border: #e2e8f0;
    --lm-border-light: #f1f5f9;
    --lm-success: #10b981;
    --lm-danger: #ef4444;
    --lm-warning: #f59e0b;
    --lm-info: #06b6d4;
    --lm-radius: 12px;
    --lm-radius-sm: 8px;
    --lm-radius-lg: 16px;
    --lm-radius-xl: 20px;
    --lm-shadow-xs: 0 1px 2px rgba(0,0,0,.04);
    --lm-shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --lm-shadow: 0 4px 6px -1px rgba(0,0,0,.06), 0 2px 4px -2px rgba(0,0,0,.04);
    --lm-shadow-md: 0 8px 16px -4px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.04);
    --lm-shadow-lg: 0 16px 32px -8px rgba(0,0,0,.1), 0 8px 16px -8px rgba(0,0,0,.06);
    --lm-shadow-xl: 0 24px 48px -12px rgba(0,0,0,.14);
    --lm-transition: 180ms ease-out;
    --lm-transition-fast: 120ms ease-out;
    --lm-transition-slow: 300ms ease-out;
    --lm-glass: rgba(255,255,255,.72);
    --lm-glass-border: rgba(255,255,255,.45);
    --lm-glass-blur: blur(16px);
}

/* --- PERFORMANCE: Reduced motion --- */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* --- BASE RESET & GPU --- */
.lm-app {
    display: flex;
    position: relative;
    min-height: auto;
    height: auto;
    background: var(--lm-bg);
    overflow: visible;
}

/* Modal Stacking Guarantees */
.modal {
    z-index: 1050 !important;
}
.modal-backdrop {
    z-index: 1040 !important;
}
.modal.fade.in, .modal.show {
    z-index: 1050 !important;
}
.modal-backdrop.fade.in, .modal-backdrop.show {
    z-index: 1040 !important;
}
.select2-container--open, .select2-dropdown {
    z-index: 1060 !important;
}

.loan-management-page .btn-primary,
.loan-management-page .btn-primary:focus {
    background-color: var(--lm-primary) !important;
    border-color: var(--lm-primary) !important;
    color: #fff !important;
}

.loan-management-page .btn-primary:hover,
.loan-management-page .btn-primary:active {
    background-color: var(--lm-primary-dark) !important;
    border-color: var(--lm-primary-dark) !important;
    color: #fff !important;
}

/* --- KHMER FONT --- */
body.loan-management-page.lm-language-km,
body.loan-management-page.lm-language-km .lm-app,
body.loan-management-page.lm-language-km .lm-main,
body.loan-management-page.lm-language-km .lm-content,
body.loan-management-page.lm-language-km .lm-sidebar,
body.loan-management-page.lm-language-km .lm-header,
body.loan-management-page.lm-language-km .modal,
body.loan-management-page.lm-language-km .modal-content,
body.loan-management-page.lm-language-km .dropdown-menu,
body.loan-management-page.lm-language-km .select2-container,
body.loan-management-page.lm-language-km .select2-results,
body.loan-management-page.lm-language-km .select2-selection,
body.loan-management-page.lm-language-km .dataTables_wrapper,
body.loan-management-page.lm-language-km table,
body.loan-management-page.lm-language-km button,
body.loan-management-page.lm-language-km input,
body.loan-management-page.lm-language-km select,
body.loan-management-page.lm-language-km textarea {
    font-family: "Kantumruy Pro", "Noto Sans Khmer", system-ui, -apple-system, sans-serif !important;
}
body.loan-management-page.lm-language-km .fa,
body.loan-management-page.lm-language-km .fas,
body.loan-management-page.lm-language-km .far,
body.loan-management-page.lm-language-km .fal,
body.loan-management-page.lm-language-km .fab {
    font-family: FontAwesome, "Font Awesome 5 Free", "Font Awesome 5 Brands" !important;
}
body.loan-management-page.lm-language-km .glyphicon {
    font-family: "Glyphicons Halflings" !important;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.lm-sidebar {
    width: var(--lm-sidebar-width);
    flex: 0 0 var(--lm-sidebar-width);
    display: flex;
    flex-direction: column;
    background: var(--lm-sidebar);
    color: var(--lm-sidebar-text);
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 2;
    border-right: 1px solid var(--lm-border);
    box-shadow: var(--lm-shadow);
    padding: 16px 12px;
    transition: width var(--lm-transition-slow), flex-basis var(--lm-transition-slow), padding var(--lm-transition-slow), transform var(--lm-transition-slow);
    font-family: "Inter", "Kantumruy Pro", system-ui, -apple-system, sans-serif;
    contain: layout style;
    will-change: transform;
}
.lm-sidebar::-webkit-scrollbar { width: 5px; }
.lm-sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; }
.lm-sidebar::-webkit-scrollbar-track { background: transparent; }

/* Brand */
.lm-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px 14px;
    border-bottom: 1px solid var(--lm-border-light);
    margin-bottom: 8px;
}
.lm-brand-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: var(--lm-radius);
    background: linear-gradient(135deg, var(--lm-primary), var(--lm-primary-light));
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,.3);
    font-size: 16px;
    transition: transform var(--lm-transition);
    will-change: transform;
}
.lm-brand-icon:hover { transform: scale(1.05); }
.lm-brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
    display: block;
}
.lm-brand-text { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.lm-brand-text span { color: var(--lm-text); font-size: 16px; font-weight: 700; line-height: 1.2; }
.lm-brand-text small { color: var(--lm-muted); font-size: 11px; font-weight: 500; margin-top: 2px; }

.lm-sidebar-collapse,
.lm-sidebar-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm);
    background: var(--lm-bg-subtle);
    color: var(--lm-text-secondary);
    cursor: pointer;
    transition: all var(--lm-transition-fast);
    will-change: transform;
}
.lm-sidebar-collapse:hover,
.lm-sidebar-close:hover {
    background: var(--lm-primary-50);
    border-color: var(--lm-primary-200);
    color: var(--lm-primary);
    transform: scale(1.05);
}
.lm-sidebar-close { display: none; }

/* Search */
.lm-sidebar-search {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    margin-bottom: 10px;
    padding: 0 10px;
    border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm);
    background: var(--lm-bg-subtle);
    color: var(--lm-muted);
    transition: border-color var(--lm-transition-fast), box-shadow var(--lm-transition-fast);
    will-change: box-shadow;
}
.lm-sidebar-search:focus-within {
    border-color: var(--lm-primary-light);
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
}
.lm-sidebar-search i { font-size: 13px; color: var(--lm-muted); }
.lm-sidebar-search input {
    min-width: 0; flex: 1 1 auto; border: 0; outline: 0;
    background: transparent; color: var(--lm-text); font-size: 13px; font-weight: 500;
}
.lm-sidebar-search input::placeholder { color: #c1c9d6; }
.lm-sidebar-search span {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 20px; border: 1px solid var(--lm-border);
    border-radius: 4px; background: #fff; color: var(--lm-muted);
    font-weight: 700; font-size: 10px;
}

.lm-sidebar-actions,
.lm-sidebar-action,
.lm-sidebar-action-grid,
.lm-sidebar-mini-action { display: none; }

/* Menu */
.lm-menu { flex: 1 0 auto; padding: 0 0 8px; }
.lm-menu-section { margin: 0 0 4px; }
.lm-menu-section-title {
    display: flex; align-items: center; gap: 8px;
    margin: 10px 6px 4px; color: var(--lm-muted);
    width: calc(100% - 12px); padding: 4px 0; border: 0; background: transparent; cursor: pointer;
    font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; text-align: left;
}
.lm-menu-section-title i { order: 1; transition: transform .15s ease; }
.lm-menu-section.is-collapsed > .lm-menu-section-title i { transform: rotate(-90deg); }
.lm-menu-section.is-collapsed > .lm-menu-link,
.lm-menu-section.is-collapsed > .lm-menu-group { display: none; }
body.lm-sidebar-collapsed .lm-menu-section.is-collapsed > .lm-menu-link { display: flex; }
.lm-workspace-tabs { display: flex; gap: 4px; overflow-x: auto; margin: 0 0 16px; border-bottom: 1px solid var(--lm-border-light); }
.lm-workspace-tabs a { flex: 0 0 auto; padding: 9px 12px; min-height: 38px; color: var(--lm-text-secondary); border-bottom: 2px solid transparent; text-decoration: none; font-size: 13px; font-weight: 600; }
.lm-workspace-tabs a:hover { color: #047857; }
.lm-workspace-tabs a.active { color: #047857; border-bottom-color: #059669; }
.lm-menu-section-title:focus-visible,
.lm-workspace-tabs a:focus-visible { outline: 2px solid #059669; outline-offset: 2px; }
.lm-menu-section-title::after {
    content: ''; height: 1px; flex: 1 1 auto; background: var(--lm-border-light);
}

.lm-menu-link,
.lm-submenu-link {
    display: flex; align-items: center; gap: 10px;
    position: relative; min-height: 36px;
    color: var(--lm-text-secondary); padding: 6px 10px;
    border-radius: var(--lm-radius-sm); text-decoration: none;
    line-height: 1.25; margin: 1px 0; font-size: 13px; font-weight: 500;
    border: 1px solid transparent;
    transition: all var(--lm-transition-fast);
    will-change: transform, background;
}
.lm-menu-link:hover,
.lm-submenu-link:hover {
    color: var(--lm-primary);
    background: var(--lm-primary-50);
    border-color: var(--lm-primary-100);
    transform: translateX(2px);
    text-decoration: none;
}
.lm-menu-link.active,
.lm-submenu-link.active {
    color: var(--lm-primary);
    background: linear-gradient(90deg, var(--lm-primary-50) 0%, rgba(99,102,241,.04) 100%);
    border-color: var(--lm-primary-200);
    box-shadow: inset 3px 0 0 var(--lm-primary);
    font-weight: 600;
}
.lm-menu-toggle { width: 100%; border: 0; background: transparent; text-align: left; }
.lm-menu-icon { flex: 0 0 20px; width: 20px; color: var(--lm-primary); text-align: center; font-size: 14px; }

.lm-menu-link.tone-green .lm-menu-icon { color: #10b981; }
.lm-menu-link.tone-red .lm-menu-icon { color: #ef4444; }
.lm-menu-link.tone-violet .lm-menu-icon { color: #8b5cf6; }
.lm-menu-link.tone-cyan .lm-menu-icon { color: #06b6d4; }
.lm-menu-link.tone-orange .lm-menu-icon { color: #f97316; }
.lm-menu-link.tone-slate .lm-menu-icon { color: #64748b; }
.lm-menu-link.tone-blue .lm-menu-icon { color: #6366f1; }

.lm-menu-label {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
}
.lm-angle { margin-left: auto; color: var(--lm-muted); transition: transform var(--lm-transition-fast); font-size: 12px; }
.lm-menu-group.open > .lm-menu-toggle .lm-angle { transform: rotate(180deg); }

.lm-submenu {
    display: none; margin: 0 0 4px 14px;
    padding: 2px 0 2px 10px; border-left: 1px solid var(--lm-border);
}
.lm-submenu-link {
    color: var(--lm-text-secondary); min-height: 30px;
    padding: 5px 8px; font-size: 12px;
}

.lm-badge {
    flex: 0 0 auto; min-width: 24px;
    border-radius: 999px; background: linear-gradient(135deg, #fef2f2, #fee2e2);
    color: var(--lm-danger); padding: 2px 7px;
    text-align: center; font-size: 10px; font-weight: 800;
}
.lm-menu-meta {
    flex: 0 0 auto; border-radius: 999px;
    background: var(--lm-bg); color: var(--lm-muted);
    padding: 2px 6px; font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0;
}
.lm-submenu-link.has-meta { color: var(--lm-muted); }

/* Admin Card */
.lm-admin-card {
    display: flex; align-items: center; gap: 10px;
    min-height: 52px; margin-top: auto;
    padding: 8px 10px; border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius); background: var(--lm-bg-subtle);
    color: var(--lm-text); text-decoration: none;
    transition: all var(--lm-transition-fast);
    will-change: transform;
}
.lm-admin-card:hover,
.lm-admin-card:focus {
    color: var(--lm-text); text-decoration: none;
    background: #fff; border-color: var(--lm-primary-200);
    box-shadow: var(--lm-shadow-sm);
    transform: translateY(-1px);
}
.lm-admin-avatar {
    position: relative; display: inline-flex;
    align-items: center; justify-content: center;
    width: 36px; height: 36px; flex: 0 0 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--lm-primary), var(--lm-primary-light));
    color: #fff; font-weight: 800; font-size: 14px;
}
.lm-admin-avatar span {
    position: absolute; right: 0; bottom: 0;
    width: 10px; height: 10px; border: 2px solid #fff;
    border-radius: 50%; background: var(--lm-success);
}
.lm-admin-info { display: flex; flex: 1 1 auto; min-width: 0; flex-direction: column; }
.lm-admin-info strong,
.lm-admin-info small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lm-admin-info strong { font-size: 13px; font-weight: 600; }
.lm-admin-info small { color: var(--lm-muted); font-size: 11px; font-weight: 500; }
.lm-admin-gear,
.lm-admin-chevron { color: var(--lm-muted); font-size: 14px; }

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
.lm-main {
    flex: 1 1 auto; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    overflow-y: visible;
    contain: layout style;
}

/* Header */
.lm-header {
    position: sticky; top: 0; z-index: 99;
    background: var(--lm-glass);
    backdrop-filter: var(--lm-glass-blur);
    -webkit-backdrop-filter: var(--lm-glass-blur);
    border-bottom: 1px solid rgba(226,232,240,.6);
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px;
    will-change: transform;
}
.lm-header-left, .lm-header-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lm-header-left { flex: 1 1 auto; }
.lm-header-right { flex: 0 1 auto; justify-content: flex-end; }
.lm-title { margin: 0; font-size: 17px; font-weight: 700; color: var(--lm-text); }
.lm-subtitle { margin: 0; font-size: 11px; color: var(--lm-muted); font-weight: 500; }
.lm-header-logo {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    border-radius: var(--lm-radius-sm);
    object-fit: cover;
    border: 1px solid var(--lm-border);
    background: #fff;
    box-shadow: var(--lm-shadow-xs);
}
.lm-quick-menu { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lm-quick-link { white-space: nowrap; }
.lm-user-meta { display: flex; flex-direction: column; text-align: right; font-size: 11px; color: var(--lm-muted); }
.lm-user-name { font-weight: 700; color: var(--lm-text); }
.lm-user-profile { position: relative; }
.lm-user-profile-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 4px 9px 4px 5px;
    border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm);
    background: #fff;
    color: var(--lm-text);
    box-shadow: var(--lm-shadow-xs);
    cursor: pointer;
}
.lm-user-profile-toggle:hover,
.lm-user-profile.open .lm-user-profile-toggle {
    border-color: var(--lm-primary-200);
    color: var(--lm-primary);
    background: var(--lm-primary-50);
}
.lm-user-avatar {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--lm-primary);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
}
.lm-user-profile-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    max-width: 150px;
    font-size: 11px;
    line-height: 1.2;
}
.lm-user-profile-text .lm-user-name,
.lm-user-profile-text .lm-location {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.lm-user-profile-menu {
    min-width: 190px;
    padding: 8px 0;
    border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm);
    box-shadow: var(--lm-shadow-lg);
}
.lm-user-profile-summary {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 14px;
    color: var(--lm-muted);
    font-size: 12px;
}
.lm-user-profile-menu > li > a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    color: var(--lm-text-secondary);
    font-weight: 600;
}
.lm-user-profile-menu > li > a:hover {
    background: var(--lm-primary-50);
    color: var(--lm-primary);
}
.lm-sidebar-toggle {
    display: none; border: 0;
    background: var(--lm-primary-50); color: var(--lm-primary);
    width: 36px; height: 36px; border-radius: var(--lm-radius-sm);
    transition: all var(--lm-transition-fast);
}
.lm-sidebar-toggle:hover { background: var(--lm-primary-100); }
.lm-header-action {
    display: inline-flex; align-items: center; gap: 6px;
    min-width: 0;
    min-height: 36px;
    padding: 7px 12px; border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm); background: #fff;
    color: var(--lm-text-secondary); font-size: 12px; font-weight: 600;
    white-space: nowrap;
    text-decoration: none;
    transition: all var(--lm-transition-fast);
    will-change: transform;
}
.lm-header-action:hover {
    border-color: var(--lm-primary-200);
    background: var(--lm-primary-50);
    color: var(--lm-primary);
    transform: translateY(-1px);
    box-shadow: var(--lm-shadow-sm);
    text-decoration: none;
}
.lm-header-badge {
    min-width: 18px; padding: 1px 5px; font-size: 10px;
    border-radius: 999px;
}
.lm-language-switch {
    display: inline-flex; align-items: center; gap: 2px;
    flex: 0 0 auto;
    padding: 2px; border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm); background: var(--lm-bg-subtle);
}
.lm-language-switch form { margin: 0; }
.lm-language-switch button {
    min-width: 38px; height: 26px; border: 0;
    border-radius: 6px; background: transparent;
    color: var(--lm-text-secondary); font-size: 11px; font-weight: 700; line-height: 1;
    transition: all var(--lm-transition-fast);
}
.lm-language-switch button.active,
.lm-language-switch button:disabled {
    background: var(--lm-primary); color: #fff; cursor: default;
}
/* Content */
.lm-content { padding: 20px; }
.lm-workspace .box,
.lm-workspace .card,
.lm-workspace .info-box { border-radius: var(--lm-radius); box-shadow: var(--lm-shadow-sm); }
.lm-breadcrumb-wrap { margin-bottom: 12px; }
.lm-breadcrumb { background: transparent; margin: 0; padding: 0; }
.lm-breadcrumb > li + li:before { content: '>'; color: var(--lm-muted); }
.lm-table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* Footer */
.lm-footer {
    padding: 14px 20px; border-top: 1px solid var(--lm-border);
    background: linear-gradient(180deg, var(--lm-bg-subtle), var(--lm-bg));
    color: var(--lm-muted); display: flex; justify-content: space-between;
    font-size: 12px;
}
.lm-mobile-nav { display: none; }

#scrollable-container {
    min-height: 0;
    height: auto !important;
    overflow: visible !important;

/* ============================================================

@keyframes lm-slideUp {

}

    from { opacity: 0; }

}

    from { transform: translate3d(0,0,0) scale(.95); opacity: 0; }
    to { transform: translate3d(0,0,0) scale(1); opacity: 1; }
}
@keyframes lm-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
@keyframes lm-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .6; }
}

.lm-animate-slideUp { animation: lm-slideUp .3s ease-out; will-change: transform, opacity; }
.lm-animate-fadeIn { animation: lm-fadeIn .2s ease-out; will-change: opacity; }

/* Admin Card */
.lm-admin-card {
    display: flex; align-items: center; gap: 10px;

    padding: 8px 10px; border: 1px solid var(--lm-border);

}
.lm-admin-avatar {
    position: relative; display: inline-flex;

.lm-admin-info { display: flex; flex: 1 1 auto; min-width: 0; flex-direction: column; }

.lm-admin-info small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lm-admin-info strong { font-size: 13px; font-weight: 600; }
.lm-admin-info small { color: var(--lm-muted); font-size: 11px; font-weight: 500; }
.lm-admin-gear,
.lm-admin-chevron { color: var(--lm-muted); font-size: 14px; }

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
.lm-main {
    flex: 1 1 auto; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    overflow-y: visible;
    contain: layout style;
}

/* Header */
.lm-header {
    position: sticky; top: 0; z-index: 99;
    background: var(--lm-glass);
    backdrop-filter: var(--lm-glass-blur);
    -webkit-backdrop-filter: var(--lm-glass-blur);
    border-bottom: 1px solid rgba(226,232,240,.6);
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px;
    will-change: transform;
}
.lm-header-left, .lm-header-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lm-header-left { flex: 1 1 auto; }
.lm-header-right { flex: 0 1 auto; justify-content: flex-end; }
.lm-title { margin: 0; font-size: 17px; font-weight: 700; color: var(--lm-text); }
.lm-subtitle { margin: 0; font-size: 11px; color: var(--lm-muted); font-weight: 500; }
.lm-header-logo {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    border-radius: var(--lm-radius-sm);

    border: 1px solid var(--lm-border);

}
.lm-quick-menu { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lm-quick-link { white-space: nowrap; }
.lm-user-meta { display: flex; flex-direction: column; text-align: right; font-size: 11px; color: var(--lm-muted); }
.lm-user-name { font-weight: 700; color: var(--lm-text); }
.lm-user-profile { position: relative; }
.lm-user-profile-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 4px 9px 4px 5px;
    border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm);
    background: #fff;
    color: var(--lm-text);
    box-shadow: var(--lm-shadow-xs);
    cursor: pointer;
}
.lm-user-profile-toggle:hover,
.lm-user-profile.open .lm-user-profile-toggle {
    border-color: var(--lm-primary-200);
    color: var(--lm-primary);
    background: var(--lm-primary-50);
}
.lm-user-avatar {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--lm-primary);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
}
.lm-user-profile-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    max-width: 150px;
    font-size: 11px;
    line-height: 1.2;
}
.lm-user-profile-text .lm-user-name,
.lm-user-profile-text .lm-location {
    max-width: 100%;

    text-overflow: ellipsis;
    white-space: nowrap;
}
.lm-user-profile-menu {
    min-width: 190px;
    padding: 8px 0;
    border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm);

}
.lm-user-profile-summary {
    display: flex;
    flex-direction: column;
    gap: 2px;

}
.lm-user-profile-menu > li > a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    color: var(--lm-text-secondary);
    font-weight: 600;
}
.lm-user-profile-menu > li > a:hover {
    background: var(--lm-primary-50);
    color: var(--lm-primary);
}
.lm-sidebar-toggle {
    display: none; border: 0;
    background: var(--lm-primary-50); color: var(--lm-primary);
    width: 36px; height: 36px; border-radius: var(--lm-radius-sm);
    transition: all var(--lm-transition-fast);
}

.lm-header-action {
    display: inline-flex; align-items: center; gap: 6px;
    min-width: 0;
    min-height: 36px;
    padding: 7px 12px; border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm); background: #fff;
    color: var(--lm-text-secondary); font-size: 12px; font-weight: 600;
    white-space: nowrap;
    text-decoration: none;

    will-change: transform;
}
.lm-header-action:hover {
    border-color: var(--lm-primary-200);
    background: var(--lm-primary-50);
    color: var(--lm-primary);

    text-decoration: none;
}
.lm-header-badge {
    min-width: 18px; padding: 1px 5px; font-size: 10px;
    border-radius: 999px;
}
.lm-language-switch {
    display: inline-flex; align-items: center; gap: 2px;
    flex: 0 0 auto;
    padding: 2px; border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-sm); background: var(--lm-bg-subtle);

.lm-language-switch form { margin: 0; }
.lm-language-switch button {
    min-width: 38px; height: 26px; border: 0;
    border-radius: 6px; background: transparent;
    color: var(--lm-text-secondary); font-size: 11px; font-weight: 700; line-height: 1;
    transition: all var(--lm-transition-fast);
}
.lm-language-switch button.active,
.lm-language-switch button:disabled {
    background: var(--lm-primary); color: #fff; cursor: default;
}
/* Content */
.lm-content { padding: 20px; }
.lm-workspace .box,
.lm-workspace .card,
.lm-workspace .info-box { border-radius: var(--lm-radius); box-shadow: var(--lm-shadow-sm); }
.lm-breadcrumb-wrap { margin-bottom: 12px; }
.lm-breadcrumb { background: transparent; margin: 0; padding: 0; }
.lm-breadcrumb > li + li:before { content: '>'; color: var(--lm-muted); }
.lm-table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* Footer */
.lm-footer {
    padding: 14px 20px; border-top: 1px solid var(--lm-border);
    background: linear-gradient(180deg, var(--lm-bg-subtle), var(--lm-bg));

}
.lm-mobile-nav { display: none; }

#scrollable-container {

    height: auto !important;

   RESPONSIVE: Tablet (max-width: 992px)
   ============================================================ */

    .lm-header { flex-wrap: nowrap; padding: 8px 14px; gap: 10px; }

    .lm-header .lm-user-meta { display: none; }

/* ============================================================
   ANIMATIONS (GPU-accelerated)
   ============================================================ */
@keyframes lm-slideUp {
    from { transform: translate3d(0,20px,0); opacity: 0; }
    to { transform: translate3d(0,0,0); opacity: 1; }
}
@keyframes lm-fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes lm-scaleIn {
    from { transform: translate3d(0,0,0) scale(.95); opacity: 0; }
    to { transform: translate3d(0,0,0) scale(1); opacity: 1; }
}
@keyframes lm-shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
@keyframes lm-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .6; }
}

.lm-animate-slideUp { animation: lm-slideUp .3s ease-out; will-change: transform, opacity; }
.lm-animate-fadeIn { animation: lm-fadeIn .2s ease-out; will-change: opacity; }
.lm-animate-scaleIn { animation: lm-scaleIn .2s ease-out; will-change: transform, opacity; }

@media (max-width: 576px) {
    .modal.show .modal-dialog, .modal.in .modal-dialog { transform: none; }
    .modal-backdrop { opacity: .5; }
    .modal-content { animation: lm-slideUp .25s ease-out; will-change: transform; }
    .toast { max-width: calc(100% - 16px); margin: 8px auto; }
}

.lm-customer-hover__actions button { border: 1px solid var(--lm-border); border-radius: var(--lm-radius-sm); background: var(--lm-bg-subtle); color: var(--lm-text-secondary); padding: 5px 8px; font-size: 11px; font-weight: 800; }
.lm-customer-hover__actions button.primary { background: var(--lm-primary); border-color: var(--lm-primary); color: #fff; }

/* Live Charts */
.lm-live-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.lm-live-panel { min-height: 360px; }
.lm-live-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #ecfeff; color: #0d9488; font-size: 11px; font-weight: 700; border: 1px solid #bae6fd; }
.lm-live-badge__dot { width: 10px; height: 10px; border-radius: 50%; background: #14b8a6; animation: lm-pulse 1.8s infinite; will-change: opacity; }
.lm-live-chart { display: flex; flex-direction: column; gap: 14px; min-height: 250px; }
.lm-live-chart__canvas {
    display: flex; align-items: flex-end; gap: 12px;
    min-height: 200px; padding: 16px; border-radius: var(--lm-radius-lg);
    background: var(--lm-bg-subtle); border: 1px solid var(--lm-border);
    overflow-x: auto;
}
.lm-live-chart__bar-group { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 52px; flex: 1 1 0; }
.lm-live-chart__bar-stack { display: flex; align-items: flex-end; justify-content: center; gap: 6px; width: 100%; min-height: 160px; }
.lm-live-chart__bar {
    width: 16px; min-height: 8px; border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, #818cf8, #6366f1);
    box-shadow: 0 2px 8px rgba(99,102,241,.18);
    transition: height var(--lm-transition-slow);
    will-change: height;
}
.lm-live-chart__bar--accent { background: linear-gradient(180deg, #34d399, #059669); box-shadow: 0 2px 8px rgba(5,150,105,.18); }
.lm-live-chart__bar--warn { background: linear-gradient(180deg, #fb7185, #e11d48); box-shadow: 0 2px 8px rgba(225,29,72,.18); }
.lm-live-chart__label { max-width: 100%; color: var(--lm-text-secondary); font-size: 11px; font-weight: 700; text-align: center; line-height: 1.25; word-break: break-word; }
.lm-live-chart__value { color: var(--lm-text); font-size: 11px; font-weight: 700; text-align: center; }
.lm-live-chart__legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--lm-muted); font-size: 12px; }
.lm-live-chart__legend-item { display: inline-flex; align-items: center; gap: 6px; }
.lm-live-chart__legend-swatch { width: 10px; height: 10px; border-radius: 999px; background: var(--lm-primary); }
.lm-live-chart__legend-swatch--accent { background: #059669; }
.lm-live-chart__legend-swatch--warn { background: #e11d48; }
.lm-live-chart__empty { display: flex; align-items: center; justify-content: center; min-height: 200px; border: 1px dashed var(--lm-border); border-radius: var(--lm-radius-lg); color: var(--lm-muted); text-align: center; padding: 20px; background: var(--lm-bg-subtle); }

/* Live Chat Shell */
.lm-live-chat-shell { display: grid; grid-template-columns: 300px minmax(0,1fr) 280px; min-height: 70vh; border: 1px solid var(--lm-border); border-radius: var(--lm-radius-xl); overflow: hidden; background: #fff; box-shadow: var(--lm-shadow); }
.lm-live-chat-inbox { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--lm-border-light); background: #fff; }
.lm-live-chat-toolbar { padding: 16px 16px 12px; border-bottom: 1px solid var(--lm-border-light); }
.lm-live-chat-toolbar h4 { margin: 0 0 10px; color: var(--lm-text); font-size: 22px; font-weight: 800; }
.lm-live-chat-search { width: 100%; height: 40px; border: 1px solid var(--lm-border); border-radius: 999px; padding: 0 16px; outline: none; background: var(--lm-bg-subtle); font-size: 13px; transition: border-color var(--lm-transition-fast), box-shadow var(--lm-transition-fast); }
.lm-live-chat-search:focus { border-color: var(--lm-primary-light); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.lm-live-chat-list { flex: 1 1 auto; overflow-y: auto; padding: 8px; }
.lm-live-chat-item { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 10px; border: 0; border-radius: var(--lm-radius); background: transparent; text-align: left; transition: background var(--lm-transition-fast); cursor: pointer; }
.lm-live-chat-item:hover,
.lm-live-chat-item.is-active { background: var(--lm-primary-50); }
.lm-live-chat-avatar { position: relative; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #e0f2fe, #dbeafe); color: #1e3a8a; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; }
.lm-live-chat-avatar::after { content: ''; position: absolute; right: 2px; bottom: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--lm-success); border: 2px solid #fff; }
.lm-live-chat-name { display: block; color: var(--lm-text); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-live-chat-preview { display: block; margin-top: 3px; color: var(--lm-muted); font-size: 12px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-live-chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 44px; }
.lm-live-chat-time { color: var(--lm-muted); font-size: 11px; font-weight: 700; }
.lm-live-chat-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--lm-primary); color: #fff; font-size: 10px; font-weight: 700; }
.lm-live-chat-main { display: flex; flex-direction: column; min-height: 0; background: var(--lm-bg-subtle); border-right: 1px solid var(--lm-border-light); }
.lm-live-chat-mainbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--lm-border-light); background: #fff; }
.lm-live-chat-main-title { margin: 0; color: var(--lm-text); font-size: 17px; font-weight: 800; }
.lm-live-chat-main-subtitle { margin: 4px 0 0; color: var(--lm-muted); font-size: 12px; }
.lm-live-chat-main-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.lm-live-chat-frame { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; background: #fff; }
.lm-live-chat-side { padding: 18px; background: #fff; overflow-y: auto; }
.lm-live-chat-profile { text-align: center; padding-bottom: 16px; border-bottom: 1px solid var(--lm-border-light); }
.lm-live-chat-profile-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px; background: linear-gradient(135deg, var(--lm-primary-100), var(--lm-primary-200)); color: var(--lm-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; }
.lm-live-chat-profile-name { margin: 0; color: var(--lm-text); font-size: 24px; font-weight: 800; }
.lm-live-chat-profile-subtitle, .lm-live-chat-profile-time { margin: 6px 0 0; color: var(--lm-muted); font-size: 13px; }
.lm-live-chat-side-section { padding: 16px 0; border-bottom: 1px solid var(--lm-border-light); }
.lm-live-chat-side-title { margin: 0 0 10px; color: var(--lm-text); font-size: 14px; font-weight: 800; }
.lm-live-chat-side-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 13px; border-bottom: 1px dashed var(--lm-border-light); }
.lm-live-chat-side-row:last-child { border-bottom: 0; }
.lm-live-chat-side-row span:first-child { color: var(--lm-muted); }
.lm-live-chat-side-row span:last-child { color: var(--lm-text); font-weight: 700; text-align: right; }
.lm-live-chat-empty { display: flex; align-items: center; justify-content: center; min-height: 200px; color: var(--lm-muted); text-align: center; padding: 20px; }

/* Chat Card */
.lm-chat-card {
    position: relative; padding: 10px; border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius-xl); background: #fff;
    box-shadow: var(--lm-shadow-sm);
}
.lm-chat-card__toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 6px; }
.lm-chat-card__title { margin: 0; color: var(--lm-text); font-size: 22px; font-weight: 800; }
.lm-chat-card__actions { display: flex; align-items: center; gap: 8px; }
.lm-chat-card__icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 999px;
    background: var(--lm-bg); color: var(--lm-muted);
    text-decoration: none !important; border: 0;
    transition: all var(--lm-transition-fast);
}
.lm-chat-card__icon:hover { background: var(--lm-primary-50); color: var(--lm-primary); }
.lm-chat-card__search { display: flex; align-items: center; gap: 12px; margin: 8px 10px 12px; padding: 12px 16px; border-radius: 999px; background: var(--lm-bg); color: var(--lm-muted); font-size: 13px; }
.lm-chat-card__tabs { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 0 10px 10px; }
.lm-chat-card__summary { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding: 0 10px 12px; }
.lm-chat-card__summary-box { padding: 12px 14px; border-radius: var(--lm-radius); background: var(--lm-bg-subtle); border: 1px solid var(--lm-border-light); }
.lm-chat-card__summary-label { display: block; color: var(--lm-muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.lm-chat-card__summary-value { display: block; margin-top: 6px; color: var(--lm-text); font-size: 22px; font-weight: 800; line-height: 1; }
.lm-chat-card__summary-note { display: block; margin-top: 4px; color: var(--lm-muted); font-size: 11px; }
.lm-chat-card__tab { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 8px 16px; border: 0; border-radius: 999px; background: transparent; color: var(--lm-text); font-size: 13px; font-weight: 700; white-space: nowrap; transition: all var(--lm-transition-fast); }
.lm-chat-card__tab.is-active { background: var(--lm-primary-50); color: var(--lm-primary); }
.lm-chat-card__list { max-height: 600px; overflow-y: auto; padding: 0 6px 8px; }
.lm-chat-card__request { display: grid; grid-template-columns: 56px minmax(0,1fr) 24px; gap: 12px; align-items: center; padding: 8px 10px 14px; }
.lm-chat-card__request-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--lm-bg); color: var(--lm-text); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; }
.lm-chat-card__request-title { margin: 0 0 2px; color: var(--lm-text); font-size: 14px; font-weight: 700; }
.lm-chat-card__request-subtitle { margin: 0; color: var(--lm-muted); font-size: 12px; }
.lm-chat-card__request-arrow { color: var(--lm-muted); font-size: 22px; text-align: right; }
.lm-chat-card__item { display: grid; grid-template-columns: 72px minmax(0,1fr) 14px; gap: 12px; align-items: center; padding: 10px; border-radius: var(--lm-radius); text-decoration: none !important; transition: background var(--lm-transition-fast); cursor: pointer; }
.lm-chat-card__item:hover { background: var(--lm-bg-subtle); }
.lm-chat-card__avatar-wrap { position: relative; width: 72px; height: 72px; }
.lm-chat-card__avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #e0f2fe, #dbeafe); color: var(--lm-text); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
.lm-chat-card__presence { position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--lm-success); border: 3px solid #fff; }
.lm-chat-card__name { display: block; margin: 0 0 4px; color: var(--lm-text); font-size: 15px; font-weight: 700; line-height: 1.3; }
.lm-chat-card__preview { display: block; margin: 0; color: var(--lm-text-secondary); font-size: 12px; line-height: 1.5; }
.lm-chat-card__time { color: var(--lm-muted); }
.lm-chat-card__dot { width: 12px; height: 12px; border-radius: 50%; background: var(--lm-primary); justify-self: end; }
.lm-chat-card__empty { margin: 8px 10px; padding: 24px 16px; border-radius: var(--lm-radius); background: var(--lm-bg-subtle); color: var(--lm-muted); text-align: center; font-size: 13px; }

/* Modal styles */
.view_modal .modal-content { border: 0; border-radius: var(--lm-radius-xl); box-shadow: var(--lm-shadow-xl); overflow: hidden; }
.view_modal .modal-header { background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca); color: #fff; border: 0; padding: 16px 20px; }
.view_modal .modal-header .modal-title { color: #fff; font-size: 17px; font-weight: 700; }
.view_modal .modal-header .modal-title .fa { margin-right: 8px; opacity: .85; }
.view_modal .modal-header .close { color: #fff; opacity: .8; text-shadow: none; }
.view_modal .modal-header .close:hover { opacity: 1; }
.view_modal .modal-body { padding: 18px 20px; background: var(--lm-bg-subtle); }
.view_modal .modal-body .well { background: #fff; border: 1px solid var(--lm-border); border-radius: var(--lm-radius); box-shadow: var(--lm-shadow-xs); padding: 14px 16px; margin-bottom: 12px; }
.view_modal .modal-body .well strong { color: var(--lm-text); font-weight: 700; }
.view_modal .modal-body .form-group label { color: var(--lm-text-secondary); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.view_modal .modal-body .form-control,
.view_modal .modal-body select.form-control { border: 1px solid var(--lm-border); border-radius: var(--lm-radius-sm); padding: 8px 12px; font-size: 13px; height: auto; transition: border-color var(--lm-transition-fast), box-shadow var(--lm-transition-fast); }
.view_modal .modal-body .form-control:focus,
.view_modal .modal-body select.form-control:focus { border-color: var(--lm-primary-light); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.view_modal .modal-body .input-group-addon { border: 1px solid var(--lm-border); border-right: 0; border-radius: var(--lm-radius-sm) 0 0 var(--lm-radius-sm); background: var(--lm-bg); color: var(--lm-muted); font-size: 13px; padding: 8px 10px; }
.view_modal .modal-body .input-group .form-control { border-left: 0; border-radius: 0 var(--lm-radius-sm) var(--lm-radius-sm) 0; }
.view_modal .modal-body .box.box-solid.bg-lightgray { background: #fff !important; border: 1px solid var(--lm-border); border-radius: var(--lm-radius); box-shadow: var(--lm-shadow-sm); overflow: hidden; }
.view_modal .modal-body .box-header { background: var(--lm-bg-subtle); border-bottom: 1px solid var(--lm-border-light); padding: 12px 16px; }
.view_modal .modal-body .box-title { font-size: 13px; font-weight: 700; color: var(--lm-text); margin: 0; }
.view_modal .modal-body .box-body { padding: 16px; }
.view_modal .modal-body .loan-payment-line { padding: 10px 0; border-bottom: 1px solid var(--lm-border-light); }
.view_modal .modal-body .loan-payment-line:last-child { border-bottom: 0; }
.view_modal .modal-body .checkbox label { font-size: 13px; font-weight: 600; color: var(--lm-text); }
.view_modal .modal-body .well-sm { background: linear-gradient(135deg, #f0fdf4, #ecfdf5); border: 1px solid #bbf7d0; border-radius: var(--lm-radius); padding: 12px 16px; }
.view_modal .modal-body .well-sm strong { color: #15803d; }
.view_modal .modal-footer { background: var(--lm-bg-subtle); border-top: 1px solid var(--lm-border-light); padding: 14px 20px; }
.view_modal .modal-footer .btn { border-radius: var(--lm-radius-sm); font-weight: 700; padding: 8px 20px; font-size: 13px; }
.lm-pay-action .btn-modal,
.lm-pay-action .lm-dashboard-refresh-schedule-btn { cursor: pointer; }
.loan-schedule-display { display: block; margin-top: 4px; color: var(--lm-text-secondary); font-size: 12px; }

/* Iframe Modal */
.lm-dashboard-iframe-modal .modal-dialog, .modal-dialog.lm-dashboard-iframe-modal { width: 98%; max-width: none; }
.lm-dashboard-iframe-modal .modal-body, .modal-dialog.lm-dashboard-iframe-modal .modal-body { padding: 0; height: calc(100vh - 96px); background: var(--lm-bg-subtle); }
.lm-dashboard-iframe-modal iframe, .modal-dialog.lm-dashboard-iframe-modal iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

/* Dashboard Dashboard Responsive */
@media (max-width: 1199px) {
    .lm-dashboard-grid, .lm-dashboard-hero-grid, .lm-live-grid { grid-template-columns: 1fr; }
    .lm-live-chat-shell { grid-template-columns: 280px minmax(0,1fr); }
    .lm-live-chat-side { display: none; }
}
@media (max-width: 992px) {
    .lm-dashboard-hero-grid { grid-template-columns: 1fr; }
    .lm-dashboard-cards { grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); }
    .lm-side-stack { flex-direction: row; gap: 14px; }
    .lm-side-stack > .lm-dashboard-panel { flex: 1; min-width: 0; }
}

        width: 100%;

        flex: 1 0 auto;

    }

    .lm-dashboard-title { font-size: 22px; margin-bottom: 4px; }

    .lm-hero-metric-label { font-size: 9px; margin-bottom: 1px; }
    .lm-hero-metric-value { font-size: 16px; }
    .lm-dashboard-cards { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
    .lm-stat-card {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px;
        min-height: 78px;
        border-radius: 12px;
        box-shadow: 0 8px 22px rgba(15,23,42,.05);
    }
    .lm-stat-card__icon { flex: 0 0 38px; width: 38px; height: 38px; font-size: 15px; border-radius: 11px; }
    .lm-stat-card__label { font-size: 11px; line-height: 1.25; letter-spacing: .03em; }
    .lm-stat-card__value { font-size: 20px; margin-top: 2px; }
    .lm-stat-card__meta { display: none; }
    .lm-dashboard-panel { border-radius: 13px; box-shadow: 0 8px 24px rgba(15,23,42,.05); }
    .lm-dashboard-panel__header {
        align-items: flex-start;
        padding: 14px 14px 10px;
        gap: 10px;
    }
    .lm-dashboard-panel__actions {
        width: 100%;
        justify-content: stretch;
    }
    .lm-dashboard-panel__actions .btn {
        width: 100%;
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--lm-radius-sm);
    }
    .lm-dashboard-panel__title { font-size: 18px; white-space: normal; overflow: visible; text-overflow: clip; }
    .lm-dashboard-panel__hint { font-size: 13px; line-height: 1.4; }
    .lm-dashboard-panel__badge { display: none; }
    .lm-dashboard-panel__body { padding: 12px 14px 14px; }
    .lm-quick-grid { grid-template-columns: 1fr; gap: 12px; }
    .lm-quick-box { padding: 14px; border-radius: 13px; }
    .lm-quick-box__topline {
        align-items: flex-start;
        flex-direction: column;

    }

    .lm-side-stack { flex-direction: column; gap: 10px; }
    .lm-live-grid { grid-template-columns: 1fr; gap: 12px; }
    .lm-dashboard-grid { grid-template-columns: 1fr; gap: 12px; min-width: 0; max-width: 100%; }
    .lm-live-chat-shell { grid-template-columns: 1fr; min-height: auto; border-radius: var(--lm-radius); }
    .lm-live-chat-inbox { min-height: 200px; max-height: 300px; border-right: 0; border-bottom: 1px solid var(--lm-border-light); }
    .lm-live-chat-main { border-right: 0; min-height: 400px; }
    .lm-live-chat-frame { min-height: 350px; }
    .lm-chart-shell { min-height: 160px; }
    .lm-dashboard-iframe-modal .modal-dialog { width: 100%; margin: 0; }
    .lm-dashboard-iframe-modal .modal-body { height: calc(100vh - 72px); }
    .lm-action-buttons { flex-direction: column; }
    .lm-action-btn { width: 100%; justify-content: center; min-height: 36px; }
    .view_modal .modal-content { border-radius: var(--lm-radius-lg); margin: 8px; }

        line-height: 1.05;
        text-align: right;
        overflow-wrap: anywhere;
    }
    .lm-overdue-mobile-badge {
        min-width: 25px;
        min-height: 18px;
        width: max-content;
        max-width: 100%;
        padding: 2px 5px;
        box-shadow: inset 0 0 0 1px rgba(239,68,68,.08);
        font-size: 8.5px;
        line-height: 1.1;
    }
    .lm-overdue-mobile-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
    .lm-overdue-mobile-grid > div {
        padding: 4px 3px;
        border-radius: 6px;
        background: #fff;
    }
    .lm-overdue-mobile-grid small {
        font-size: 6.8px;
        letter-spacing: 0;
        white-space: nowrap;
    }
    .lm-overdue-mobile-grid span {
        font-size: 8.5px;
        line-height: 1.1;
        overflow-wrap: anywhere;
    }
    .lm-dashboard-mobile-card__status {
        max-width: 96px;
        padding: 3px 7px;
        font-size: 9px;
    }
    .lm-dashboard-mobile-card__amount { font-size: 13px; }
    .lm-collect-payment-card__actions { gap: 6px; }
    .lm-collect-payment-card__actions .btn,
    .lm-overdue-mobile-card .btn,
    .lm-dashboard-mobile-card .btn {
        min-height: 30px;
        padding: 4px 7px;
        border-radius: 7px;
        font-size: 10.5px;
        gap: 4px;
    }
    .lm-overdue-mobile-card .btn {
        min-height: 27px;
        padding: 3px 6px;
        border-radius: 6px;
        font-size: 9.5px;
    }
    .lm-chart-shell { padding: 10px; }
    .lm-chart-copy strong { font-size: 13px; }
    .lm-chart-copy small { font-size: 10px; line-height: 1.3; }
}

@media (max-width: 340px) {
    .lm-dashboard-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lm-overdue-mobile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ============================================================
   DASHBOARD UTILITIES (shared by tables & quick actions)
   ============================================================ */
.lm-dashboard-panel__body--quick-actions { display: flex; flex-direction: column; }
.lm-dashboard-panel__body--quick-actions .lm-quick-grid { flex: 1; }

.lm-quick-box__chip--pay {
    background: linear-gradient(135deg, #f0fdf4, #dcfce7) !important;
    border: 1px solid #bbf7d0;
    color: #15803d !important;
}
.lm-quick-box__chip--pay .fa { color: #10b981; }

.lm-customer-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.lm-dashboard-frame-link { display: inline-block; color: var(--lm-primary); font-weight: 700; text-decoration: none; }
.lm-dashboard-frame-link:hover { color: var(--lm-primary-dark); text-decoration: underline; }

.lm-pay-due { min-width: 110px; white-space: nowrap; color: var(--lm-text-secondary); font-weight: 600; }
.lm-pay-balance { min-width: 120px; white-space: nowrap; }

.lm-pay-more { display: inline-block; vertical-align: middle; }

.lm-action-menu__list {
    padding: 6px; border: 1px solid var(--lm-border);
    border-radius: var(--lm-radius); box-shadow: var(--lm-shadow-md);
}
.lm-action-menu__list > li { padding: 0; }
.lm-action-menu__list > li > button {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 8px 12px; margin: 0;
    border: 0; background: transparent; border-radius: var(--lm-radius-sm);
    color: var(--lm-text-secondary); font-size: 12px; font-weight: 700;
    text-align: left; cursor: pointer;
    transition: background var(--lm-transition-fast), color var(--lm-transition-fast);
}
.lm-action-menu__list > li > button i { width: 16px; color: var(--lm-muted); text-align: center; font-size: 13px; }
.lm-action-menu__list > li > button:hover {
    background: var(--lm-primary-50); color: var(--lm-primary);
}
.lm-action-menu__list > li > button:hover i { color: var(--lm-primary); }
.lm-action-menu__list > li > button[data-title="Edit Loan"] i { color: var(--lm-warning); }
.lm-action-menu__list > li.divider { margin: 4px 0; }

/* ============================================================
   DASHBOARD PROFESSIONAL POLISH
   ============================================================ */
.lm-dashboard {
    gap: 18px;
    color: #0f172a;
}
.lm-dashboard-command {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 430px);
    gap: 18px;
    align-items: stretch;
    padding: 20px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
}
.lm-dashboard-command__main {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.lm-dashboard-command__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    margin-bottom: 8px;
    color: #2563eb;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
}
.lm-dashboard-command__title {
    margin: 0;
    color: #0f172a;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 0;
}
.lm-dashboard-command__subtitle {
    max-width: 760px;
    margin: 8px 0 0;
    color: #64748b;
    font-size: 13px;
    line-height: 1.6;
}
.lm-dashboard-command__chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}
.lm-dashboard-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 30px;
    padding: 6px 10px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    color: #475569;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
}
.lm-dashboard-chip:hover,
.lm-dashboard-chip:focus {
    color: #1d4ed8;
    text-decoration: none;
    border-color: #bfdbfe;
    background: #eff6ff;
}
.lm-dashboard-chip--success {
    color: #166534;
    border-color: #bbf7d0;
    background: #f0fdf4;
}
.lm-dashboard-chip--warning {
    color: #92400e;
    border-color: #fde68a;
    background: #fffbeb;
}
.lm-dashboard-chip--danger {
    color: #991b1b;
    border-color: #fecaca;
    background: #fef2f2;
}
.lm-dashboard-command__actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}
.lm-dashboard-action {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 58px;
    padding: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    color: #334155;
    text-decoration: none;
    transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease;
}
.lm-dashboard-action span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #e2e8f0;
    color: #334155;
    flex: 0 0 auto;
}
.lm-dashboard-action strong {
    min-width: 0;
    color: inherit;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.25;
}
.lm-dashboard-action:hover,
.lm-dashboard-action:focus {
    transform: translateY(-1px);
    color: #0f172a;
    text-decoration: none;
    border-color: #cbd5e1;
    background: #fff;
    box-shadow: 0 8px 18px rgba(15, 23, 42, .08);
}
.lm-dashboard-action--primary span { background: #dbeafe; color: #2563eb; }
.lm-dashboard-action--success span { background: #dcfce7; color: #16a34a; }
.lm-dashboard-action--info span { background: #cffafe; color: #0891b2; }
.lm-dashboard-action--neutral span { background: #e2e8f0; color: #475569; }
.lm-dashboard-summary-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}
.lm-dashboard-summary-card {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    min-height: 76px;
    padding: 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
}
.lm-dashboard-summary-card__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    color: #fff;
    flex: 0 0 auto;
}
.lm-dashboard-summary-card__label {
    display: block;
    color: #64748b;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
}
.lm-dashboard-summary-card__value {
    display: block;
    margin-top: 4px;
    color: #0f172a;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.1;
    overflow-wrap: anywhere;
}
.lm-dashboard-cards {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px;
}
.lm-stat-card {
    min-height: 112px;
    padding: 14px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
}
.lm-stat-card__icon {
    width: 38px;
    height: 38px;
    border-radius: 8px;
}
.lm-stat-card__label {
    color: #64748b;
    letter-spacing: .04em;
}
.lm-stat-card__value {
    font-size: 23px;
}
.lm-stat-card__meta {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #2563eb;
    font-weight: 700;
}
.lm-dashboard-panel,
.lm-quick-box,
.lm-action-menu__list {
    border-radius: 8px;
}
.lm-dashboard-panel--feature {
    background: #fff;
}
.lm-dashboard-panel__header {
    background: #fff;
}
.lm-dashboard-table > thead > tr > th {
    background: #f8fafc;
}
.lm-dashboard-panel--quick-payment .lm-quick-box {
    border: 0;
    box-shadow: none;
    padding: 0;
}
.lm-dashboard-panel--quick-payment .lm-quick-box:hover {
    transform: none;
    box-shadow: none;
    background: #fff;
}
.lm-dashboard-panel--quick-payment .lm-quick-box__topline {
    padding-bottom: 10px;
    border-bottom: 1px solid #e2e8f0;
}
.lm-dashboard-panel--quick-payment .lm-quick-box__footer {
    margin-top: 10px;
}
.lm-dashboard-panel--quick-payment .lm-collect-payment-scroll {
    max-height: 430px;
    overflow-y: auto;
    overflow-x: auto;
}
.lm-dashboard-panel--quick-payment .lm-collect-payment-scroll::-webkit-scrollbar,
.lm-dashboard-panel--quick-payment .lm-collect-payment-mobile-list::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
.lm-dashboard-panel--quick-payment .lm-collect-payment-scroll::-webkit-scrollbar-thumb,
.lm-dashboard-panel--quick-payment .lm-collect-payment-mobile-list::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 999px;
}
.lm-dashboard-panel--quick-payment .lm-collect-payment-card {
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(15,23,42,.06);
}

@media (max-width: 1199px) {
    .lm-dashboard-command {
        grid-template-columns: 1fr;
    }
    .lm-dashboard-cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 991px) {
    .lm-dashboard-summary-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 767px) {
    .lm-dashboard-command {
        padding: 14px 12px;
    }
    .lm-dashboard-command__title {
        font-size: 20px;
    }
    .lm-dashboard-command__actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }
    .lm-dashboard-summary-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 10px;
    }
    .lm-dashboard-summary-card {
        padding: 8px 10px;
        min-height: 52px;
        gap: 9px;
        border-radius: 8px;
    }
    .lm-dashboard-summary-card__icon {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        font-size: 13px;
    }
    .lm-dashboard-summary-card__label {
        font-size: 9.5px;
        letter-spacing: 0.02em;
    }
    .lm-dashboard-summary-card__value {
        font-size: 15px;
        margin-top: 1px;
    }
    .lm-dashboard-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 12px;
    }
    .lm-stat-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 66px;
        padding: 7px 4px 6px;
        border-radius: 8px;
        gap: 2px;
        background: #fff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .lm-stat-card:active {
        transform: scale(0.97);
    }
    .lm-stat-card > div {
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .lm-stat-card__icon {
        width: 24px;
        height: 24px;
        min-width: 24px;
        min-height: 24px;
        flex: 0 0 24px;
        border-radius: 6px;
        font-size: 11px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .lm-stat-card__label {
        font-size: 8.5px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: 0.01em;
        color: #64748b;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        display: block;
        padding: 0 2px;
    }
    .lm-stat-card__value {
        font-size: 14px;
        font-weight: 800;
        line-height: 1.1;
        color: #0f172a;
        letter-spacing: -0.02em;
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        display: block;
    }
    .lm-stat-card__value[data-format="money"] {
        font-size: 11.5px;
    }
    .lm-stat-card__meta {
        display: none !important;
    }
    .lm-dashboard-action {
        min-height: 46px;
        padding: 8px 10px;
        border-radius: 8px;
    }
    .lm-dashboard-chip {
        max-width: 100%;
        white-space: normal;
        line-height: 1.3;
        font-size: 11px;
        padding: 4px 8px;
    }
    .lm-dashboard-panel--quick-payment .lm-collect-payment-mobile-list {
        max-height: min(64vh, 520px);
        overflow-y: auto;
        padding-right: 2px;
    }
}

@media (max-width: 375px) {
    .lm-dashboard-cards {
        gap: 4px;
    }
    .lm-stat-card {
        min-height: 60px;
        padding: 6px 2px 5px;
        border-radius: 7px;
    }
    .lm-stat-card__icon {
        width: 22px;
        height: 22px;
        min-width: 22px;
        min-height: 22px;
        flex: 0 0 22px;
        font-size: 10px;
        border-radius: 5px;
    }
    .lm-stat-card__label {
        font-size: 7.5px;
    }
    .lm-stat-card__value {
        font-size: 12.5px;
    }
    .lm-stat-card__value[data-format="money"] {
        font-size: 10px;
    }
    .lm-dashboard-summary-card {
        padding: 7px 8px;
        min-height: 48px;
        gap: 7px;
    }
    .lm-dashboard-summary-card__icon {
        width: 26px;
        height: 26px;
        font-size: 11px;
    }
    .lm-dashboard-summary-card__label {
        font-size: 8.5px;
    }
    .lm-dashboard-summary-card__value {
        font-size: 13.5px;
    }
}
